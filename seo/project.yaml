# Генератор статей: блог сайта Life OS (с 31.10). Общие правила — в коде (lifeos/articles_rules.md), здесь — своё.
# Реестр — clusters.yaml рядом, его ведёт `lifeos articles`; команды — из life/ с --site ../lifeos-site.
# Решение — life/projects/life-os/decisions/decisions-2026-10-31.md.
name: "Блог Life OS"
content: src                # статьи — src/blog/; остальное в src/ пишется руками и gen.py, генератор его только читает
exclude: [drafts, en]       # черновики страниц и английская версия — не страницы блога
demand: optional            # темы — из решений и замеров системы, а не из спроса; ключи называет владелец
page_types:
  article: {permalink: "/blog/{slug}/", file: "blog/{slug}.md", fm: {date: "{today}"}}
  page: {permalink: "/{slug}/"}
  use: {permalink: "/dlya/{slug}/"}
  howto: {permalink: "/kak/{slug}/"}
cta:
  - slug: kontakt
    name: "Написать автору в Telegram"
    url: "https://t.me/cookiespooky"
  - slug: chto-vnutri
    name: "Что внутри: части системы"
    url: "/chto-vnutri/"
facts: []
facts_files: []             # общих нет: у каждой статьи свои, --facts-file при add
rules: |
  Читатель — человек, который сам работает с нейросетями или выбирает систему для своего дела: он знает, что такое
  модель, контекст и токены, но не читал код Life OS. Блог объясняет, как система устроена и почему так, а не иначе.

  - Голос — первое лицо автора: «я решил», «я отказался», «я замерил». Рассуждение о сделанном, не о планах.
  - Каждый раздел держится на одном конкретном факте: дата, число, замер, отвергнутая альтернатива. Нет факта — нет
    раздела. Из раздела должен получаться пост для аккаунта Life OS в Threads: правила постов —
    life/projects/threads-plan/generation-rules.md.
  - Где система не подходит или что не получилось — писать так же прямо, как о том, что получилось.
  - Без повелительного наклонения, обращённого к читателю («попробуйте», «сделайте»); без длинного тире.
  - Без продажи: призыв в конце — ссылка на цель из брифа одной фразой.
  - Имена заказчиков, людей и компаний не называть: «клиент», «компания-перевозчик». Их ловит стоп-список хранилища.
  - Код и имена файлов — только когда без них непонятно; команда `lifeos …` уместна, путь к файлу хранилища — нет.
stop: ["лучший", "лучшие", "№1", "номер один", "100%", "гарантируем результат", "революц", "волшебн"]
stop_vault: [timeline_stop] # имена заказчиков из life/lifeos.yaml
