<article class="page container">
  <header class="page__head">
    {{- if .FM.kicker }}
    <p class="eyebrow"><span>{{ .FM.kicker }}</span>{{ if .FM.badge }}<span class="badge">{{ .FM.badge }}</span>{{ end }}</p>
    {{- end }}
    <h1>{{ .Page.Title }}</h1>
    {{- if .Page.Description }}
    <p class="deck">{{ .Page.Description }}</p>
    {{- end }}
  </header>
  {{- if .FM.visual }}
  <figure class="page__visual"><img src="{{ .FM.visual }}" alt="Схема к статье «{{ .Page.Title }}»" width="1200" height="600" /></figure>
  {{- end }}
  <div class="prose">
    {{ .Body }}
  </div>
</article>
