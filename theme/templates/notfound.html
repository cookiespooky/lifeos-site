<!doctype html>
<html lang="{{ or .Settings.lang "ru" }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="{{ .BaseURL }}/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="{{ .BaseURL }}/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="{{ .BaseURL }}/apple-touch-icon.png" />
  <link rel="stylesheet" href="{{ .AssetsBase }}/tokens.css" />
  <link rel="stylesheet" href="{{ .AssetsBase }}/styles.css" />
  <title>{{ or .Settings.notfound_title "Страница не найдена" }}</title>
</head>
<body>
  <main class="page container">
    <header class="page__head">
      <p class="eyebrow"><span>404</span></p>
      <h1>{{ or .Settings.notfound_title "Страница не найдена" }}</h1>
      <p class="deck">{{ or .Settings.notfound_text "Возможно, она переехала." }} <a class="more" href="{{ .BaseURL }}">{{ or .Settings.notfound_home "На главную" }} →</a></p>
    </header>
  </main>
</body>
</html>
